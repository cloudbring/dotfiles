"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[cmd_duration]
min_time = 2_000

# Runtime versions show automatically in projects that use them
# (node, bun, python, go, rust, java, …), each in its own color.
[nodejs]
format = 'via [$symbol($version )]($style)'
[python]
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[gcloud]
disabled = true   # was showing the tandembrain account
