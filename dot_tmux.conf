# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# TMUX SETTINGS
  # https://gitlab.com/gnachman/iterm2/-/wikis/tmux-Integration-Best-Practices
  # Add to .zshrc:
  # export ITERM_ENABLE_SHELL_INTEGRATION_WITH_TMUX=YES
  set-option -g allow-passthrough on
  set-option -g set-titles on
  set-option -g set-titles-string '#T'
  set -g allow-rename on
  set -g default-terminal "xterm-256color"
  set -s extended-keys on
  set -as terminal-features 'xterm*:extkeys'
  set -as terminal-features 'xterm-ghostty:extkeys'


# Plugins List (Source: https://ccavales3.medium.com/code-like-a-hacker-another-neovim-terminal-setup-4613abecb7c8 )
  set -g @plugin 'tmux-plugins/tpm'
  set -g @plugin 'tmux-plugins/tmux-sensible' # Sensible defaults
  set -g @plugin 'tmux-plugins/tmux-resurrect'
  set -g @plugin 'tmux-plugins/tmux-continuum'
  set -g @plugin 'tmux-plugins/tmux-copycat'
  set -g @plugin 'tmux-plugins/tmux-yank'
  set -g @plugin 'tmux-plugins/tmux-open'

# Tmux Powerline Theme
set -g @plugin 'wfxr/tmux-power'
  set -g @tmux_power_time_format '%l:%M %p' # 2:04 PM

  set -g @plugin 'wfxr/tmux-net-speed' # Show Speed Settings
    set -g @tmux_power_show_upload_speed true
    set -g @tmux_power_show_download_speed true

  set -g @plugin 'wfxr/tmux-prefix-highlight' # Show when doing a tmux cmd
    # 'L' for left only, 'R' for right only and 'LR' for both
    set -g @tmux_power_prefix_highlight_pos 'LR'

  set -g @plugin 'wfxr/tmux-web-reachable' # Internet Dialtone
    set -g @tmux_power_show_web_reachable true

# TMUX Pomodoro Plus
set -g @plugin 'olimorris/tmux-pomodoro-plus'
  # <tmux-prefix> p to start a pomodoro
  # <tmux-prefix> P to cancel a pomodoro
  # <tmux-prefix> C-p to open the pomodoro timer menu
  # <tmux-prefix> M-p to set a custom pomodoro timer
  set -g status-left "#{pomodoro_status}"
  set -g @pomodoro_granularity 'on'

# Pain Control - Better Keybindings for Window Control
set -g @plugin 'tmux-plugins/tmux-pain-control'
  # Navigation
  # 
  #   prefix + h and prefix + C-h
  #   select pane on the left
  #   prefix + j and prefix + C-j
  #   select pane below the current one
  #   prefix + k and prefix + C-k
  #   select pane above
  #   prefix + l and prefix + C-l
  #   select pane on the right
  # 
  #   Note: This overrides tmux's default binding for toggling between last active windows, prefix + l. tmux-sensible gives you a better binding for that, prefix + a (if your prefix is C-a).
  # 
  # pane resizing
  # 
  # 
  # Resizing panes
  # 
  #   prefix + shift + h
  #   resize current pane 5 cells to the left
  #   prefix + shift + j
  #   resize 5 cells in the down direction
  #   prefix + shift + k
  #   resize 5 cells in the up direction
  #   prefix + shift + l
  #   resize 5 cells to the right
  #   These mappings are repeatable.
  # 
  #   The amount of cells to resize can be configured with @pane_resize option. See configuration section for the details.
  # 
  # pane splitting
  # 
  # 
  # Splitting panes
  # 
  #   prefix + |
  #   split the current pane into two, left and right.
  #   prefix + -
  #   split the current pane into two, top and bottom.
  #   prefix + \
  #   split current pane full width into two, left and right.
  #   prefix + _
  #   split current pane full height into two, top and bottom.
  #   > Newly created pane always has the same path as the original pane.

# CONFIG

# tmux-continuum
  # - Requires tmux-resurrect to work. 
  # - Continuously saves your tmux environment and sessions. 
  # - Automatically opens and restores tmux when computer is turned on.
  set -g @continuum-restore 'on'
  set -g @continuum-boot 'on'

# Keep this line at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
